[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxkit"
version = "0.3.1"
description = "Get your financial documents out of Gmail: search, download, unlock password-protected PDFs, read them."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "inboxkit contributors"}]
dependencies = ["pikepdf>=8.0.0", "pdfplumber>=0.10.0"]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-auth-httplib2>=0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finkit"
version = "0.1.0"
description = "Small, tested building blocks for personal-finance tools: Gmail documents, PDF unlock, keychain secrets."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "finkit contributors"}]
dependencies = ["pikepdf>=8.0.0", "pdfplumber>=0.10.0"]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-auth-httplib2>=0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
